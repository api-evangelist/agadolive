aid: agadolive
name: AgadoLive
description: 'Agado Live is an AI-powered telerehabilitation platform built for physical
  therapy clinics, letting one therapist supervise many patients at once while capturing
  measurable outcomes. Its computer-vision engine extracts joint kinematics in real
  time from a single smartphone or webcam, with no wearables, markers, or proprietary
  hardware, then flags form issues live and directs the therapist''s attention where
  it is needed most. The platform delivers Live Group Care, AI movement assessment,
  auto-generated SOAP notes, and specialized orthopedic, neurological, and geriatric
  protocols. Founded by Tzach Goren, Gili Yaron, Gil Shamai, and Vittaly Tavor, Agado
  Live operates from Tel Aviv and Boston and is backed by Techstars. Added to the
  API Evangelist network as a company profile; the company publishes a marketing and
  clinical site but no public developer API surface at this time.'
